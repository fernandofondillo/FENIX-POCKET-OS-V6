name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # V6: regenerar ios/ si no está en el repo (placeholder, luego se sobreescribe con flutter create --platforms)
      - name: Ensure ios/ exists (V6)
        run: |
          if [ ! -d "ios" ]; then
            flutter create --org ai.quyriux --platforms=ios --project-name fenix_pocket_os .
          fi

      - name: Pod Install
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (No Codesign)
        run: flutter build ipa --release --no-codesign 2>&1 || (echo "=== build ipa falló, fallback a build ios --no-codesign ===" && flutter build ios --release --no-codesign)

      - name: Create Payload and Zip
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r app-release.ipa Payload
          cd ../../../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/iphoneos/app-release.ipa
