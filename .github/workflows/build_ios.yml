name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # V6: regenerar ios/ si no está en el repo (placeholder, luego se sobreescribe con flutter create --platforms)
      - name: Ensure ios/ exists (V6)
        run: |
          if [ ! -d "ios" ]; then
            flutter create --org ai.quyriux --platforms=ios --project-name fenix_pocket_os .
          fi

      - name: Pod Install
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (No Codesign)
        run: |
          # Compilar directamente con xcodebuild para tener control total del signing
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -30
          cd ..

      - name: Create Payload and Zip
        run: |
          # xcodebuild deja el .app en DerivedData, buscarlo
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*Release-iphoneos*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*Release-iphoneos*" 2>/dev/null | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r app-release.ipa Payload
          cd $GITHUB_WORKSPACE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ~/Library/Developer/Xcode/DerivedData/**/app-release.ipa
